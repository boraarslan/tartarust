[workspace]
resolver = "3"
members = [
    "crates/tartarust-protocol",
    "crates/tartarust-hid",
    "crates/tartarust-ipc",
    "crates/tartarust-daemon",
    "crates/tartarust-cli",
    "crates/tartarust-ui",
]
# With a root [package] present, cargo's default member set silently collapses
# to JUST the root package — a bare `cargo test` would then build only the
# three empty bin shims and report green with zero tests run. List everything
# so the muscle-memory `cargo build`/`cargo test` keep covering the workspace.
default-members = [
    ".",
    "crates/tartarust-protocol",
    "crates/tartarust-hid",
    "crates/tartarust-ipc",
    "crates/tartarust-daemon",
    "crates/tartarust-cli",
    "crates/tartarust-ui",
]

[workspace.package]
# One version for the whole workspace: every crate sets `version.workspace = true`
# so a single bump here moves the root package and all six member crates together.
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["bora.rs <bora.rs@pm.me>"]
rust-version = "1.95"
repository = ""

# Shared dependency palette. Member crates opt in with `dep = { workspace = true }`
# so versions stay aligned across the workspace. Versions for device/UI-specific
# crates (deku, evdev, hidapi, dioxus) are pinned as each milestone lands and the
# research docs (docs/research/) confirm current versions.
[workspace.dependencies]
# error handling / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# serialization / IPC
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# async runtime (daemon)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
# internal crates
tartarust-protocol = { path = "crates/tartarust-protocol" }
tartarust-hid = { path = "crates/tartarust-hid" }
tartarust-ipc = { path = "crates/tartarust-ipc" }
tartarust-daemon = { path = "crates/tartarust-daemon" }
tartarust-cli = { path = "crates/tartarust-cli" }
tartarust-ui = { path = "crates/tartarust-ui" }

[workspace.lints.rust]
unused_must_use = "warn"

[workspace.lints.clippy]
uninlined_format_args = "allow"

# Root package: exists ONLY so one `cargo install --path .` ships all three
# binaries (cargo installs a single package per invocation). The bins are thin
# `src/bin/*.rs` shims calling a public entry fn in each member crate — all real
# code stays in the crates. A root package is implicitly a workspace member.
[package]
name = "tartarust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Razer Tartarus Pro userspace driver suite: daemon + CLI + UI in one install."

# Preserve the exact per-crate binary names (`tartarust` is the CLI's name).
[[bin]]
name = "tartarust-daemon"
path = "src/bin/tartarust-daemon.rs"

[[bin]]
name = "tartarust"
path = "src/bin/tartarust.rs"

[[bin]]
name = "tartarust-ui"
path = "src/bin/tartarust-ui.rs"

[dependencies]
tartarust-daemon = { workspace = true }
tartarust-cli = { workspace = true }
tartarust-ui = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true

[profile.release]
lto = "thin"
strip = true

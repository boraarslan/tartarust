# tartarust — ANALOG demo config. Runs the keypad in ANALOG mode: the daemon
# enters driver mode, reads per-key pressure, and fires each key at its
# actuation point — so the 20 grid keys become analog.
#
#   cp docs/examples/config-analog.toml ~/.config/tartarust/config.toml
#   cargo run --release --bin tartarust-daemon -- run  # Ctrl-C restores normal mode
#
# What to try (focus a text editor first):
#   * Press grid keys with a LIGHT touch -> nothing; press past ~halfway -> they
#     type. That gap is the analog actuation point (digital keys can't do this).
#   * The W-position key -> Up arrow (a remap, applied on top of analog).
#   * The "1" key -> types "hi" (a macro).
#   * The S key: light press = "s", HARD press = "S" (dual-step second action).

default_profile = "default"
auto_switch = false
input_mode = "analog"

[profiles.default]
name = "default"

[profiles.default.lighting]
brightness = 255
effect = { effect = "spectrum" }

# Demo remaps. Any analog key WITHOUT a bind here passes through (types itself).
[profiles.default.base]
KEY_W = { type = "key", keys = ["KEY_UP"] }   # W-position key -> Up arrow
KEY_1 = { type = "macro", name = "demo" }     # "1" key -> types "hi"

[macros.demo]
name = "demo"
steps = [
  { step = "press", key = "KEY_H" }, { step = "release", key = "KEY_H" },
  { step = "press", key = "KEY_I" }, { step = "release", key = "KEY_I" },
]

# ===========================================================================
# ANALOG MAP — built into the daemon. The byte index -> grid key layout is a
# device-family constant (hardware-confirmed, identical across units), so
# nothing needs mapping by hand. An [analog.keys.N] entry OVERRIDES one byte
# index — use it to tune thresholds or add a dual-step action; unlisted
# indices keep the built-in key at the default 0x60 (fire) / 0x50 (release)
# points. Bytes 20-22 are unused, and the circular thumb button, 8-way
# thumbpad, and wheel are digital-only (no pressure byte, not analog-mappable).
# ===========================================================================
[analog]
poll_interval_ms = 50

# Dual-step demo: light press emits KEY_S ("s"); a hard press (past 0xC0) also
# emits KEY_LEFTSHIFT, so a deep press types "S". Byte 12 is the S-position cap.
[analog.keys.12]
key = "KEY_S"
second_actuation_point = 0xC0
second_action = "KEY_LEFTSHIFT"

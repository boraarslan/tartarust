# CI: formatting, lints, tests. All three jobs run in parallel.
#
# The UI crate (gpui) needs xkbcommon + fontconfig/freetype dev packages to
# compile on Linux (font-kit and xkbcommon link C libraries; the wayland/x11
# and render stacks are pure Rust). fmt does not compile anything, so only
# clippy/test install system packages. The daemon's uinput-gated integration
# tests detect that /dev/uinput is not writable on hosted runners and skip
# themselves green.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (xkbcommon / fontconfig for the GPUI UI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (xkbcommon / fontconfig for the GPUI UI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- tartarust app icon. Palette mirrors src/style.rs: bg/surface
       #101214 on #0a0b0c lines, accent green #44d62c. A 3x3 keypad dot grid
       plus the offset round thumb button — the Tartarus silhouette reduced to
       what survives 16px. Flat shapes only: no filters, gradients, or text. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#101214" stroke="#2c3238" stroke-width="2"/>
  <g fill="#9aa3a9">
    <circle cx="15" cy="15" r="3.6"/>
    <circle cx="25.5" cy="15" r="3.6"/>
    <circle cx="36" cy="15" r="3.6"/>
    <circle cx="15" cy="25.5" r="3.6"/>
    <circle cx="25.5" cy="25.5" r="3.6"/>
    <circle cx="36" cy="25.5" r="3.6"/>
    <circle cx="15" cy="36" r="3.6"/>
    <circle cx="25.5" cy="36" r="3.6"/>
    <circle cx="36" cy="36" r="3.6"/>
  </g>
  <circle cx="47.5" cy="47.5" r="7" fill="#44d62c"/>
</svg>

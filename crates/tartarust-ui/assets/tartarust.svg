<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- tartarust app icon. Palette mirrors src/style.rs: dark faceplate,
       steel strokes, accent green #44d62c reserved for active state. The
       Tartarus Pro reduced to its topography: a 3x4 block of square keycaps
       (upper left) and the 8-way thumb pad - a disc with four engraved
       directional wedges, NOT a cross, which reads as a zoom/add button -
       bottom right, where a left thumb falls. One keycap is pressed and lit:
       per-key remap + lighting, the driver's job. Simple gradients only -
       no filters, no text - so it survives librsvg and 16px. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171b1f"/>
      <stop offset="1" stop-color="#0d0f11"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#44d62c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#44d62c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#plate)" stroke="#2c3238" stroke-width="2"/>

  <!-- underglow of the pressed key: visible in the gaps between caps -->
  <circle cx="24.95" cy="25.95" r="13" fill="url(#glow)"/>

  <!-- keycap grid, 3 rows x 4 cols; (row 2, col 2) is the active key -->
  <g fill="#232a30" stroke="#3a434b" stroke-width="1">
    <rect x="9"    y="10"   width="8.5" height="8.5" rx="2.2"/>
    <rect x="20.7" y="10"   width="8.5" height="8.5" rx="2.2"/>
    <rect x="32.4" y="10"   width="8.5" height="8.5" rx="2.2"/>
    <rect x="44.1" y="10"   width="8.5" height="8.5" rx="2.2"/>
    <rect x="9"    y="21.7" width="8.5" height="8.5" rx="2.2"/>
    <rect x="32.4" y="21.7" width="8.5" height="8.5" rx="2.2"/>
    <rect x="44.1" y="21.7" width="8.5" height="8.5" rx="2.2"/>
    <rect x="9"    y="33.4" width="8.5" height="8.5" rx="2.2"/>
    <rect x="20.7" y="33.4" width="8.5" height="8.5" rx="2.2"/>
    <rect x="32.4" y="33.4" width="8.5" height="8.5" rx="2.2"/>
    <rect x="44.1" y="33.4" width="8.5" height="8.5" rx="2.2"/>
  </g>
  <!-- the pressed key: inset a hair (travel) and lit -->
  <rect x="21.3" y="22.3" width="7.3" height="7.3" rx="2" fill="#44d62c" stroke="#2ea31d" stroke-width="1"/>

  <!-- 8-way thumb pad: disc + four engraved directional wedges -->
  <circle cx="45.5" cy="49.5" r="6.5" fill="#232a30" stroke="#3a434b" stroke-width="1"/>
  <g fill="#0d0f11">
    <polygon points="45.5,44.9 44,47.1 47,47.1"/>
    <polygon points="45.5,54.1 44,51.9 47,51.9"/>
    <polygon points="40.9,49.5 43.1,48 43.1,51"/>
    <polygon points="50.1,49.5 47.9,48 47.9,51"/>
  </g>
</svg>

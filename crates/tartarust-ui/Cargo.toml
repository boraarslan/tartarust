[package]
name = "tartarust-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Dioxus desktop UI for the Tartarus Pro (Synapse-style, original dark theme)."
# Lib-only: the `tartarust-ui` bin target lives in the workspace's root package
# (a thin shim over `run_app`) so one `cargo install` ships all bins.

[dependencies]
tartarust-ipc = { workspace = true }
dioxus = { version = "0.7", features = ["desktop", "router"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[package]
name = "tartarust-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "GPUI desktop UI for the Tartarus Pro (Synapse-style, original dark theme)."
# Lib-only: the `tartarust-ui` bin target lives in the workspace's root package
# (a thin shim over `run_app`) so one `cargo install` ships all bins.

[dependencies]
# `bundle` = the shared profile export/import file logic (TOML encode + parse).
tartarust-ipc = { workspace = true, features = ["bundle"] }
# Exact pin: gpui is pre-1.0 and breaks between versions (docs/GPUI_MIGRATION.md).
# Default features already cover Linux: font-kit + wayland + x11.
gpui = "=0.2.2"
# Interactive primitives (input, slider, switch, dropdown, modal) — the
# drag/focus/IME-heavy widgets. Bespoke pieces (keypad, LEDs) stay hand-rolled.
gpui-component = "=0.5.1"
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

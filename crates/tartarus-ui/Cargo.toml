[package]
name = "tartarus-ui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Dioxus desktop UI for the Tartarus Pro (Synapse-style, original dark theme)."

[[bin]]
name = "tartarus-ui"
path = "src/main.rs"

[dependencies]
tartarus-ipc = { workspace = true }
dioxus = { version = "0.7", features = ["desktop", "router"] }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

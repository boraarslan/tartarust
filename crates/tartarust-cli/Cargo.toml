[package]
name = "tartarust-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Command-line client for the Tartarus Pro daemon (scriptable control + diagnostics)."
# Lib-only: the `tartarust` bin target lives in the workspace's root package
# (a thin shim over `main`) so one `cargo install` ships all bins.

[dependencies]
tartarust-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
# Profile bundles / config files are TOML (same version the daemon pins).
toml = "0.8"

[lints]
workspace = true

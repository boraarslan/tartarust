[package]
name = "tartarust-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Background service: owns the device, runs the evdev->uinput remap engine, serves IPC."
# Lib-only: the `tartarust-daemon` bin target lives in the workspace's root
# package (a thin shim over `cli::main`) so one `cargo install` ships all bins.

[dependencies]
tartarust-protocol = { workspace = true }
tartarust-hid = { workspace = true }
tartarust-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
# device/remap-specific: evdev grab + uinput, config parse, CLI args
evdev = "0.13.2"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
# System tray (StatusNotifierItem over D-Bus). Runs on its own zbus/tokio tasks,
# no GTK main loop — the right fit for a headless daemon. Default features pull
# the `tokio` integration so it shares the daemon's runtime.
# async-io, NOT the default tokio: the root package builds the daemon and the
# UI into one dependency graph, so ksni's default `zbus/tokio` feature would
# unify into the UI's zbus too — which panics there ("no reactor running";
# gpui/oo7 expect async-io zbus and the UI has no tokio runtime). ksni's async
# API is identical under async-io; only zbus's internal executor changes.
ksni = { version = "0.3", default-features = false, features = ["async-io"] }

[dev-dependencies]
toml = "0.8"

[lints]
workspace = true

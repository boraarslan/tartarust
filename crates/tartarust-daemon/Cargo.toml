[package]
name = "tartarust-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Background service: owns the device, runs the evdev->uinput remap engine, serves IPC."
# Lib-only: the `tartarust-daemon` bin target lives in the workspace's root
# package (a thin shim over `cli::main`) so one `cargo install` ships all bins.

[dependencies]
tartarust-protocol = { workspace = true }
tartarust-hid = { workspace = true }
tartarust-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
# device/remap-specific: evdev grab + uinput, config parse, CLI args
evdev = "0.13.2"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
# System tray (StatusNotifierItem over D-Bus). Runs on its own zbus/tokio tasks,
# no GTK main loop — the right fit for a headless daemon. Default features pull
# the `tokio` integration so it shares the daemon's runtime.
ksni = "0.3"

[dev-dependencies]
toml = "0.8"

[lints]
workspace = true

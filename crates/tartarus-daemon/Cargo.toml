[package]
name = "tartarus-daemon"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Background service: owns the device, runs the evdev->uinput remap engine, serves IPC."

[[bin]]
name = "tartarus-daemon"
path = "src/main.rs"

[dependencies]
tartarus-protocol = { workspace = true }
tartarus-hid = { workspace = true }
tartarus-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
# device/remap-specific: evdev grab + uinput, config parse, CLI args
evdev = "0.13.2"
clap = { version = "4", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
toml = "0.8"

[lints]
workspace = true
